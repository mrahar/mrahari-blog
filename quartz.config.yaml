# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: محمدرضا آهاری
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: fa-IR
  baseUrl: blog.mrahari.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Vazirmatn
      body: Vazirmatn
      code: JetBrains Mono
    colors:
      # Baran brand palette — light mode: "after the rain"
      lightMode:
        light: "#F7FAFC"
        lightgray: "#DCE7F0"
        gray: "#52708C"
        darkgray: "#22405C"
        dark: "#0F2A43"
        secondary: "#0A72BD"
        tertiary: "#2FA8E0"
        highlight: rgba(47, 168, 224, 0.1)
        textHighlight: rgba(47, 168, 224, 0.3)
      # Baran brand palette — dark mode: "rainy night"
      darkMode:
        light: "#0A1622"
        lightgray: "#1D3349"
        gray: "#93AECA"
        darkgray: "#C9D9E8"
        dark: "#E8F1F8"
        secondary: "#6BC4F5"
        tertiary: "#8ED4F8"
        highlight: rgba(107, 196, 245, 0.1)
        textHighlight: rgba(107, 196, 245, 0.3)
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: ./plugins/bidi-text
    enabled: true
    order: 35
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  # Keep enabled for its TRANSFORMER (populates fileData.toc), but no `layout`
  # so its own component is NOT rendered — we render our local site-widgets
  # TableOfContents instead (boxed, spaced, working collapse toggle).
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: googleFonts
      title:
        name: Vazirmatn
        weights: [400, 700, 900]
      header:
        name: Vazirmatn
        weights: [400, 700, 900]
      body:
        name: Vazirmatn
        weights: [400, 700]
      interface:
        name: Vazirmatn
        weights: [400, 700]
      code:
        name: JetBrains Mono
        weights: [400, 600]
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: false # replaced by recent-notes ("آخرین مطالب") — full tree gets too long as posts grow
    layout:
      position: left
      priority: 50
  # Community graph DISABLED: it reads the current slug from window.location
  # (percent-encoded for Persian) without decoding, so on every Persian page the
  # current node is isolated with a garbled label. Replaced by our local
  # graph-fa which decodes the slug.
  - source: github:quartz-community/graph
    enabled: false
    layout:
      position: right
      priority: 10
  - source:
      repo: ./plugins/graph-fa
      name: GraphFa
    enabled: true
    options:
      localGraph:
        depth: 2 # notes mostly connect through the home hub; depth 2 shows the wider neighbourhood so the local graph does not look empty
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: false # replaced by local site-widgets Backlinks (renamed title)
    layout:
      position: right
      priority: 50
      condition: not-index
  - source:
      repo: ./plugins/site-widgets
      name: SiteBacklinks
    enabled: true
    options:
      title: ارجاع‌ها به این نوشته
      hideWhenEmpty: true
      emptyText: هنوز نوشته‌ای به این‌جا ارجاع نداده
    layout:
      position: right
      priority: 50
      condition: not-index
  # فهرست مطالب — باکسِ محلیِ داخلِ صفحه‌ی نت (بالای متن)، با فلشِ جمع‌شونده‌ی سالم
  - source:
      repo: ./plugins/site-widgets
      name: SiteToc
    enabled: true
    options:
      title: فهرست مطالب
      collapseByDefault: false
    layout:
      position: beforeBody
      priority: 25
      condition: not-index
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: ./plugins/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source:
      repo: ./plugins/content-meta
      name: ArchiveList
    enabled: true
    layout:
      position: afterBody
      priority: 5
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      rootName: خانه
      spacerSymbol: "❯"
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false # replaced by our self-hosted comment widget (static/comments.js)
    options:
      provider: giscus
      options:
        repo: mrahar/mrahari-blog
        repoId: R_kgDOTTF-sA
        category: Announcements
        categoryId: DIC_kwDOTTF-sM4DBC69
        mapping: pathname
        strict: true
        reactionsEnabled: true
        inputPosition: bottom
        lightTheme: light
        darkTheme: dark
        themeUrl: https://giscus.app/themes
        lang: fa
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        "© مجوز محتوا (CC BY-NC-SA)": "/لایسنس"
  - source: github:quartz-community/recent-notes
    enabled: false # replaced by local site-widgets Topics (curated links)
    options:
      title: آخرین مطالب
      limit: 5
      linkToMore: false
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: left
      priority: 45
  # موضوعات اصلی — لیستِ دستی. برای تکمیل، فقط items زیر را ویرایش کن
  # (href = اسلاگِ نتِ داخلی مثل «ذهن-دوم»، یا آدرسِ کاملِ خارجی که با http شروع شود).
  - source:
      repo: ./plugins/site-widgets
      name: Topics
    enabled: true
    options:
      title: موضوعات اصلی
      items:
        - title: ذهن دوم
          href: ذهن-دوم
        - title: قیمت‌گذاری در دیجی‌کالا
          href: قیمت‌گذاری-در-دیجی‌کالا
        - title: وضعیت رشد نوشته‌ها
          href: وضعیت-رشد
        - title: درباره
          href: درباره
    layout:
      position: left
      priority: 45
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: default
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
